<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DS컴퍼니 소셜벤처 IR 상호평가</title><style>
:root{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#142849;background:#f5f8fc}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-top:6px solid #1970c6;border-bottom:1px solid #dce5f1;padding:18px max(18px,calc((100vw - 1040px)/2));display:flex;justify-content:space-between;align-items:center}header strong{font-size:22px}header span{font-size:13px;color:#66788f}main{max-width:1040px;margin:26px auto;padding:0 16px}.panel{background:#fff;border:1px solid #e0e8f1;border-radius:17px;padding:22px;margin:16px 0;box-shadow:0 3px 12px #132e4910}h1{font-size:27px;margin:0 0 10px}h2{font-size:21px;margin:0 0 16px}h3{font-size:18px;margin:0 0 12px}p,.muted{color:#64748b;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{display:block;font-weight:700;margin:13px 0 7px}input,select,textarea{font:inherit;border:1px solid #c9d5e4;border-radius:10px;padding:12px;width:100%;background:white}button,.btn{font:inherit;cursor:pointer;border:0;border-radius:10px;background:#1768bd;color:#fff;padding:12px 18px;font-weight:700;text-decoration:none;display:inline-block}button:disabled{background:#b9c5d4;cursor:not-allowed}.ghost{background:#edf4fb;color:#155b9b}.danger{background:#bc3448}.small{padding:8px 12px;font-size:13px}.score{display:flex;gap:6px;flex-wrap:wrap}.score button{background:#edf3f9;color:#1c456c;padding:9px 11px}.score button.active{background:#1768bd;color:#fff}.pill{display:inline-block;padding:5px 9px;border-radius:30px;background:#e9f3ff;color:#195c9b;font-size:12px;font-weight:700}.bar{height:11px;border-radius:20px;background:#e8edf3;overflow:hidden}.bar>div{height:100%;background:#2878cb}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:12px;border-bottom:1px solid #e4ebf3;text-align:left;font-size:14px}th{background:#f2f6fb}#notice{position:sticky;top:0;z-index:5}.msg{padding:13px;background:#e9f6ee;border-radius:10px;color:#165c31;margin:10px 0}.err{background:#fff0f1;color:#a32235}.hidden{display:none!important}.stat{background:#f2f7fd;border-radius:13px;padding:16px}.stat b{font-size:25px}.qr{width:150px;height:150px;object-fit:contain;border:1px solid #d8e3ef}.center{text-align:center}.footer{font-size:12px;text-align:center;color:#789;margin:30px}.sep{border:0;border-top:1px solid #e5eaf0;margin:20px 0}@media(max-width:600px){header strong{font-size:17px}.panel{padding:16px}h1{font-size:23px}button{max-width:100%}}
</style></head><body><header><strong>DS COMPANY <span>｜ 소셜벤처 IR 피칭</span></strong><span>상호평가 시스템</span></header><main><div id="notice"></div><div id="app"></div></main><div class="footer">(주)디에스컴퍼니 · 소셜벤처 IR 피칭 상호평가</div><script>
const $=s=>document.querySelector(s), app=$('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentClass=Number(location.pathname.match(/^\/c\/([1-8])$/)?.[1]||1), adminClass=1, snapshot=[], student=null, studentRatings={},poller=null;
async function api(path,data,token){let r=await fetch(path,{method:data===undefined?'GET':'POST',headers:{...(data===undefined?{}:{'Content-Type':'application/json'}),...(token?{'Authorization':'Bearer '+token}:{})},credentials:'same-origin',body:data===undefined?undefined:JSON.stringify(data)});let v=r.headers.get('content-type')?.includes('json')?await r.json():null;if(!r.ok)throw Error(v?.error||'요청에 실패했습니다.');return v}
function notice(s,error=false){$('#notice').innerHTML=`<div class="msg ${error?'err':''}">${esc(s)}</div>`;setTimeout(()=>{if($('#notice'))$('#notice').innerHTML=''},5500)}
function page(s){app.innerHTML=s;window.scrollTo({top:0,behavior:'smooth'})}
const labelStatus={draft:'준비',open:'평가 진행',closed:'마감'};
async function studentHome(){let c=await api('/api/public/class/'+currentClass);page(`<h1>${esc(c.name)} 소셜벤처 IR 피칭 평가</h1><p>본인 팀을 제외한 모든 팀의 발표를 평가합니다. 평가코드는 제출 후 다시 사용할 수 없습니다.</p><div class="panel"><span class="pill">${labelStatus[c.status]}</span><h2>평가코드 입력</h2><label>개별 평가코드</label><input id="code" autocomplete="off" placeholder="예: ABCD-EFGH-JKLM" maxlength="20"><p class="muted">담당 강사가 배부한 본인 전용 코드를 입력하세요. 소속 팀은 코드로 자동 확인됩니다.</p><button id="enter" ${c.status!=='open'?'disabled':''}>평가 시작하기</button></div>`);$('#enter').onclick=async()=>{try{let r=await api('/api/student/login',{class_id:currentClass,code:$('#code').value});sessionStorage.setItem('ir_student_'+currentClass,r.token);await loadStudent()}catch(e){notice(e.message,true)}}}
async function loadStudent(){let tok=sessionStorage.getItem('ir_student_'+currentClass);if(!tok)return studentHome();try{student=await api('/api/student/me',undefined,tok)}catch{sessionStorage.removeItem('ir_student_'+currentClass);return studentHome()}if(student.submitted){page('<div class="panel center"><h1>평가가 제출되었습니다.</h1><p>참여해 주셔서 감사합니다.</p></div>');return}renderStudent()}
function renderStudent(){let t=student.targets;let complete=t.filter(x=>['social','profit','feasible'].every(k=>studentRatings[x.id]?.[k]!==undefined)).length;page(`<h1>${esc(student.class)} · IR 피칭 상호평가</h1><div class="panel"><span class="pill">본인 팀: ${esc(student.own_team.name)}</span><p>본인 팀은 자동 제외됩니다. 총 ${t.length}개 팀을 평가하세요.</p><b>평가 완료 ${complete}/${t.length}팀</b><div class="bar"><div style="width:${complete/t.length*100}%"></div></div></div>${t.map(x=>`<section class="panel"><h2>${esc(x.name)}</h2>${[['social','사회적 가치',40],['profit','수익 가능성',30],['feasible','실현 가능성',30]].map(([k,n,max])=>`<label>${n} <span class="muted">(${max}점 만점)</span></label><div class="score">${Array.from({length:max/5+1},(_,i)=>i*5).map(v=>`<button class="small ${studentRatings[x.id]?.[k]===v?'active':''}" data-team="${x.id}" data-key="${k}" data-score="${v}">${v}</button>`).join('')}</div>`).join('')}<p><b>팀 총점: ${['social','profit','feasible'].every(k=>studentRatings[x.id]?.[k]!==undefined)?Object.values(studentRatings[x.id]).reduce((a,b)=>a+b,0)+'점':'미완료'}</b></p></section>`).join('')}<div class="panel"><button id="submit" ${complete!==t.length?'disabled':''}>전체 평가 최종 제출</button><p class="muted">제출 후 수정할 수 없습니다.</p></div>`);document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{let id=Number(b.dataset.team);studentRatings[id]??={};studentRatings[id][b.dataset.key]=Number(b.dataset.score);renderStudent()});$('#submit').onclick=async()=>{if(!confirm('모든 팀의 평가를 최종 제출하시겠습니까? 제출 후 수정할 수 없습니다.'))return;try{await api('/api/student/submit',{ratings:t.map(x=>({team_id:x.id,...studentRatings[x.id]}))},sessionStorage.getItem('ir_student_'+currentClass));studentRatings={};sessionStorage.removeItem('ir_student_'+currentClass);page('<div class="panel center"><h1>✓ 평가 제출 완료</h1><p>모든 팀에 대한 평가가 안전하게 저장되었습니다.</p></div>')}catch(e){notice(e.message,true)}}}
function loginAdmin(){page(`<h1>강사용 관리자</h1><div class="panel"><h2>관리자 로그인</h2><label>관리자 비밀번호</label><input type="password" id="password" autocomplete="current-password"><p class="muted">비밀번호는 서버 환경변수로 설정합니다.</p><button id="login">로그인</button></div>`);$('#login').onclick=async()=>{try{await api('/api/admin/login',{password:$('#password').value});await loadAdmin()}catch(e){notice(e.message,true)}}}
async function loadAdmin(){try{snapshot=await api('/api/admin/overview')}catch{return loginAdmin()}renderAdmin();if(!poller)poller=setInterval(async()=>{if(location.pathname!='/admin')return;try{snapshot=await api('/api/admin/overview');if(!document.activeElement?.matches('input,textarea,select'))renderAdmin()}catch{}},5000)}
function downloadCodes(rows,cid){let content='\ufeff학급,팀,평가코드\r\n'+rows.map(x=>[x.class,x.team,x.code].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));a.download=`${cid}반_일회용평가코드.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function renderAdmin(){let c=snapshot[adminClass-1];if(!c)return;page(`<div class="flex" style="justify-content:space-between"><div><h1>강사용 실시간 대시보드</h1><p>5초마다 자동 갱신 · 반별 결과 독립 집계</p></div><button class="ghost small" id="logout">로그아웃</button></div><div class="grid">${snapshot.map(x=>`<button class="${x.id===adminClass?'':'ghost'}" data-class="${x.id}">${x.name}<br><small>${labelStatus[x.status]} · ${x.submitted}/${x.registered}명</small></button>`).join('')}</div><div class="panel"><div class="flex" style="justify-content:space-between"><h2>${c.name} 관리</h2><span class="pill">${labelStatus[c.status]}</span></div><div class="grid"><div class="stat">등록 인원<br><b>${c.registered}명</b></div><div class="stat">제출 인원<br><b>${c.submitted}명</b></div><div class="stat">참여율<br><b>${c.registered?Math.round(c.submitted/c.registered*100):0}%</b></div><div class="stat">팀 수<br><b>${c.teams.length}팀</b></div></div><hr class="sep"><h3>팀 구성</h3><p class="muted">한 줄에 한 팀씩 입력하세요. 평가코드 발급 후에는 팀 구성을 변경할 수 없습니다.</p><textarea id="teams" rows="5" ${c.registered||c.status!=='draft'?'disabled':''}>${esc(c.teams.map(x=>x.name).join('\n'))}</textarea><div class="flex"><button id="saveTeams" ${c.registered||c.status!=='draft'?'disabled':''}>팀 구성 저장</button><button class="ghost" id="open" ${c.status==='open'?'disabled':''}>평가 시작</button><button class="danger" id="close" ${c.status==='closed'?'disabled':''}>평가 마감</button></div><hr class="sep"><h3>일회용 평가코드 발급</h3><div class="grid"><div><label>소속 팀</label><select id="teamSelect">${c.teams.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div><label>발급 인원 수</label><input id="count" type="number" min="1" max="100" value="5"></div></div><p><button id="codes" ${!c.teams.length||c.status==='closed'?'disabled':''}>선택 팀 평가코드 생성 및 CSV 다운로드</button></p><p class="muted">코드는 생성 시 한 번만 다운로드됩니다. 학생들에게 개별적으로 전달하세요.</p><hr class="sep"><h3>학급 전용 QR코드</h3><div class="flex"><img class="qr" src="/api/admin/qr/${c.id}.png" alt="${c.name} QR코드"><div><p><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.url)}</a></p><a class="btn ghost" href="/api/admin/qr/${c.id}.png" download="${c.id}반_QR.png">QR 이미지 저장</a></div></div></div><div class="panel"><div class="flex" style="justify-content:space-between"><h2>팀별 실시간 평가 결과</h2><a class="btn ghost small" href="/api/admin/results/${c.id}.csv" download>결과 CSV 다운로드</a></div><div class="tablewrap"><table><thead><tr><th>순위</th><th>팀</th><th>평가 수</th><th>사회적 가치 /40</th><th>수익 가능성 /30</th><th>실현 가능성 /30</th><th>평균 총점 /100</th></tr></thead><tbody>${c.results.map((r,i)=>`<tr><td>${r.count?i+1:'-'}</td><td><b>${esc(r.name)}</b></td><td>${r.count}</td><td>${r.social??'-'}</td><td>${r.profit??'-'}</td><td>${r.feasible??'-'}</td><td><b>${r.total??'-'}</b></td></tr>`).join('')}</tbody></table></div><p class="muted">순위는 평가자의 총점 평균을 기준으로 합니다. 평가가 없으면 순위가 표시되지 않습니다.</p></div>`);
 document.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{adminClass=Number(b.dataset.class);renderAdmin()});$('#logout').onclick=async()=>{await api('/api/admin/logout',{});clearInterval(poller);poller=null;loginAdmin()};$('#saveTeams').onclick=async()=>{try{await api(`/api/admin/class/${c.id}/teams`,{names:$('#teams').value.split('\n').map(x=>x.trim()).filter(Boolean)});notice('팀 구성이 저장되었습니다.');await loadAdmin()}catch(e){notice(e.message,true)}};$('#open').onclick=()=>status('open');$('#close').onclick=()=>status('closed');async function status(s){if(!confirm(`${c.name} 평가를 ${s==='open'?'시작':'마감'}할까요?`))return;try{await api(`/api/admin/class/${c.id}/status`,{status:s});await loadAdmin()}catch(e){notice(e.message,true)}}$('#codes').onclick=async()=>{let n=Number($('#count').value);try{let r=await api(`/api/admin/class/${c.id}/codes`,{team_id:Number($('#teamSelect').value),count:n});downloadCodes(r.codes,c.id);notice(`${n}개의 평가코드를 발급하고 CSV 파일을 다운로드했습니다. 안전하게 보관하세요.`);await loadAdmin()}catch(e){notice(e.message,true)}}}
if(location.pathname==='/admin')loadAdmin();else if(/^\/c\/[1-8]$/.test(location.pathname))loadStudent();else page('<div class="panel"><h1>소셜벤처 IR 피칭 상호평가</h1><p>담당 강사가 안내한 학급별 QR코드로 접속하세요.</p><a class="btn" href="/admin">강사용 관리자 화면</a></div>');
</script></body></html>
